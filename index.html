<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Ecosystem</title>
  </head>
  <body>
    <div id="game" aria-label="Alien Ecosystem game"></div>
    <div id="entry" class="entry-screen">
      <div class="entry-panel">
        <p class="eyebrow">EXPEDITION 01 · UNKNOWN PLANET</p>
        <h1>ALIEN<br /><span>ECOSYSTEM</span></h1>
        <p class="entry-copy">Your ship is down. The planet is alive. Watch before you move.</p>
        <button id="enter" type="button">Enter expedition</button>
        <p class="controls-hint">WASD to move · Mouse to look · Shift to crouch · Esc to release cursor</p>
      </div>
    </div>
    <div id="game-hint" class="game-hint" aria-live="polite">Click to enter the expedition</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
